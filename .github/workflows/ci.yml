name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run lint
        working-directory: frontend
        run: npm run lint
      - name: Run tests
        working-directory: frontend
        run: npm test

  docker-deployment:
    name: Docker deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose file
        run: docker compose --env-file deploy/.env.example -f compose.production.yaml config
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e APP_DOMAIN=example.com
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile
      - name: Build production images
        run: docker compose --env-file deploy/.env.example -f compose.production.yaml build
